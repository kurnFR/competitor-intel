<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign in - {{ app_name }}</title>
    {% include "_head.html" %}
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-4">
    <main class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-xl shadow-lg p-8">
        <div class="text-center mb-6">
            <div class="text-blue-600 text-3xl mb-2"><i class="fa-solid fa-chart-line"></i></div>
            <h1 class="text-lg font-bold text-slate-800 dark:text-slate-100">{{ app_name }}</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Sign in to continue</p>
        </div>
        <div id="error" role="alert" class="hidden mb-4 rounded-md bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-sm px-3 py-2"></div>
        <form id="login-form" class="space-y-4" autocomplete="on">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Username
                <input id="username" name="username" type="text" autocomplete="username" required maxlength="64" autofocus
                       class="mt-1 w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </label>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Password
                <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"
                       class="mt-1 w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </label>
            <button id="submit" type="submit" class="w-full rounded-md bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 disabled:opacity-60">Sign in</button>
        </form>
        <p class="mt-6 text-xs text-slate-400 text-center">Access is logged. Contact an administrator if you need an account.</p>
    </main>
    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('hidden');
            const btn = document.getElementById('submit');
            btn.disabled = true;
            try {
                const r = await fetch('/api/v1/auth/login', {
                    method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: form.username.value, password: form.password.value}),
                });
                if (!r.ok) throw new Error(await errText(r));
                const data = await r.json();
                location.href = data.user.must_change_password ? '/account' : '/';
            } catch (e) {
                errorBox.textContent = e.message;
                errorBox.classList.remove('hidden');
                form.password.value = '';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
