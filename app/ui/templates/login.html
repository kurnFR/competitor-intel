<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign in - {{ app_name }}</title>
    {% include "_head.html" %}
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-4">
    <main class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-xl shadow-lg p-8">
        <div class="text-center mb-6">
            <div class="text-blue-600 text-3xl mb-2"><i class="fa-solid fa-chart-line"></i></div>
            <h1 class="text-lg font-bold text-slate-800 dark:text-slate-100">{{ app_name }}</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Sign in to continue</p>
        </div>
        <div id="error" role="alert" class="hidden mb-4 rounded-md bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-sm px-3 py-2"></div>
        <form id="login-form" class="space-y-4" autocomplete="on">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Username
                <input id="username" name="username" type="text" autocomplete="username" required maxlength="64" autofocus
                       class="mt-1 w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </label>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Password
                <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"
                       class="mt-1 w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </label>
            <button id="submit" type="submit" class="w-full rounded-md bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 disabled:opacity-60">Sign in</button>
        </form>
        <form id="mfa-form" class="space-y-4 hidden" autocomplete="off">
            <p class="text-sm text-slate-600 dark:text-slate-300">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Code
                <input id="mfa-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required maxlength="32"
                       class="mt-1 w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-100 px-3 py-2 tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-blue-500">
            </label>
            <button id="mfa-submit" type="submit" class="w-full rounded-md bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 disabled:opacity-60">Verify</button>
            <button type="button" onclick="location.reload()" class="w-full text-xs text-slate-500 hover:underline">Start over</button>
        </form>
        <p class="mt-6 text-xs text-slate-400 text-center">Access is logged. Contact an administrator if you need an account.</p>
    </main>
    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error');
        const mfaForm = document.getElementById('mfa-form');
        let challenge = null;
        function fail(message, btn) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
            btn.disabled = false;
        }
        function finish(data) { location.href = (data.user.must_change_password || data.user.mfa_setup_required) ? '/account' : '/'; }
        async function post(url, payload) {
            const r = await fetch(url, {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
            if (!r.ok) throw new Error(await errText(r));
            return r.json();
        }
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('hidden');
            const btn = document.getElementById('submit');
            btn.disabled = true;
            try {
                const data = await post('/api/v1/auth/login', {username: form.elements['username'].value, password: form.elements['password'].value});
                if (data.mfa_required) {
                    challenge = data.challenge;
                    form.classList.add('hidden');
                    mfaForm.classList.remove('hidden');
                    document.getElementById('mfa-code').focus();
                    return;
                }
                finish(data);
            } catch (e) {
                form.elements['password'].value = '';
                fail(e.message, btn);
            }
        });
        mfaForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('hidden');
            const btn = document.getElementById('mfa-submit');
            btn.disabled = true;
            try {
                finish(await post('/api/v1/auth/login/mfa', {challenge, code: mfaForm.elements['code'].value}));
            } catch (e) {
                mfaForm.elements['code'].value = '';
                fail(e.message, btn);
            }
        });
    </script>
</body>
</html>
