name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: competitor_intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/competitor_intel
      DATABASE_URL_ADMIN: postgresql+psycopg://ci:ci@localhost:5432/competitor_intel
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (real bugs only)
        run: ruff check app scripts
      - name: Prepare database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d competitor_intel -c "CREATE SCHEMA IF NOT EXISTS competitor_intel; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          alembic upgrade head
          python scripts/seed_data.py
      - run: python -m pytest tests -q
