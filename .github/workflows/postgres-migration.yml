name: PostgreSQL migration verification

on:
  push:
    branches: [master]
  pull_request:

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: competitor_intel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d competitor_intel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/competitor_intel
      DATABASE_URL_ADMIN: postgresql+psycopg://postgres:postgres@localhost:5432/competitor_intel
      DATABASE_SCHEMA: competitor_intel
      APP_ENV: test
      DEBUG: "false"
      LLM_BASE_URL: http://127.0.0.1:20128/v1
      LLM_API_KEY: test
      LLM_MODEL: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify clean database migration
        run: |
          alembic upgrade head
          PYTHONPATH=. pytest -q tests/integration/test_postgres_schema.py
          alembic downgrade base
          alembic upgrade head
          PYTHONPATH=. pytest -q tests/integration/test_postgres_schema.py

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest -q tests/unit tests/test_api.py
